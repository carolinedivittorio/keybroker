name: Release

# Push a tag like v0.1.0 (matching app/package.json) to build, sign, notarize and upload
# a draft GitHub release. Review the draft on GitHub, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - name: Make sure Electron's binary is present
        run: node app/node_modules/electron/install.js

      - name: Tag must match the app version
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match app/package.json version $version" >&2
            exit 1
          fi

      - run: pnpm test

      - name: Build, sign and notarize the app
        run: pnpm --filter keybroker release
        env:
          # Developer ID Application certificate + key, exported as .p12 and base64-encoded.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder notarizes the app; the .dmg people download needs its own ticket.
      - name: Notarize and staple the disk image
        run: |
          dmg=$(ls app/dist/Keybroker-*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify what users will download
        run: |
          # These checks talk to Apple's servers, so retry brief network blips.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retrying in 15s ($i/3)"; sleep 15; done; return 1; }
          # stapler validate re-checks an already-stapled ticket against Apple's ticket server.
          # Gatekeeper (spctl) is the strict check; a ticket-server outage only warns.
          recheck_ticket() { retry xcrun stapler validate "$1" || echo "::warning::Couldn't reach Apple to re-check the stapled ticket on $1"; }
          app=$(ls -d app/dist/mac-arm64/Keybroker.app)
          dmg=$(ls app/dist/Keybroker-*.dmg)
          codesign --verify --deep --strict --verbose=2 "$app"
          retry spctl --assess --type execute --verbose "$app"
          recheck_ticket "$app"
          # Check the disk image as a browser download would be checked.
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$dmg"
          retry spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          recheck_ticket "$dmg"

      - name: Upload to a draft release
        run: |
          cd app/dist
          gh release create "$GITHUB_REF_NAME" --draft --title "Keybroker ${GITHUB_REF_NAME#v}" --generate-notes \
            Keybroker-*.dmg Keybroker-*.zip Keybroker-*.zip.blockmap latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
