name: Release

# Push a tag like v0.1.0 (matching app/package.json) to build, sign, notarize and upload
# a draft GitHub release. Review the draft on GitHub, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - name: Make sure Electron's binary is present
        run: node app/node_modules/electron/install.js

      - name: Tag must match the app version
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match app/package.json version $version" >&2
            exit 1
          fi

      - run: pnpm test

      - name: Build, sign, notarize and upload
        run: pnpm --filter keybroker release
        env:
          # Developer ID Application certificate + key, exported as .p12 and base64-encoded.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          # Notarization.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the signature and notarization
        run: |
          app=$(ls -d app/dist/mac-arm64/Keybroker.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
