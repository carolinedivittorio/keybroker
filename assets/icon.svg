<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Brand blue oklch(0.5 0.134 242.749) = #0069a8 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c81c0"/>
      <stop offset="1" stop-color="#00548b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F5B53D"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B23A"/>
      <stop offset="1" stop-color="#D98F1E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00243d" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- macOS squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g transform="rotate(-32 512 512) translate(30 0)" filter="url(#shadow)">
    <!-- shaft + teeth -->
    <rect x="455" y="474" width="355" height="76" rx="38" fill="url(#gold)"/>
    <rect x="640" y="530" width="56" height="96" rx="16" fill="url(#goldDark)"/>
    <rect x="722" y="530" width="56" height="72" rx="16" fill="url(#goldDark)"/>
    <!-- collar -->
    <rect x="452" y="450" width="44" height="124" rx="18" fill="url(#goldDark)"/>
    <!-- bow: ring with a hole -->
    <path fill="url(#gold)" fill-rule="evenodd"
          d="M315 342 a170 170 0 1 0 0.01 0 Z M315 442 a70 70 0 1 1 -0.01 0 Z"/>
    <path d="M190 470 A135 135 0 0 1 330 377" stroke="#FFF4C8" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
